name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Bütçe asistanı aracı sunucusu (worker/assistant-proxy). CLOUDFLARE_API_TOKEN yoksa atlanır.
      # Kurulum başarısız olursa site yine yayınlanır; yalnızca sohbet kapalı derlenir.
      - name: Asistan aracısını Cloudflare'e kur
        id: proxy
        continue-on-error: true
        run: bash scripts/deploy-assistant.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: npm run build
        env:
          # Boşsa asistan sohbeti kapalı derlenir; öneriler yine çalışır.
          VITE_ASSISTANT_PROXY_URL: ${{ steps.proxy.outputs.url || vars.ASSISTANT_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
