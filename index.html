<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kredi kartı ve KMH limitlerinden ne kadarını harcayabileceğini gösteren bütçe uygulaması." />
    <meta name="theme-color" content="#0A0A11" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A11" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Limitlerim" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Kart Limitlerim</title>
    <!--
      Boot screen and theme before first paint. The native splash and the default theme are
      dark (#0a0a11). #boot covers the page on that ground until the first render; then
      dismissBoot() in src/ui/theme.ts takes it down: a short fade over a light theme
      (data-boot="fade", set below), at once over the dark theme or with reduced motion.
      The theme logic mirrors src/ui/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('kl:theme') || 'dark'
          var root = document.documentElement
          if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t)
          var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          if (light) root.setAttribute('data-boot', 'fade')
        } catch (e) {}
      })()
    </script>
    <style>
      html {
        background: #0a0a11;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a11;
        color: #f5f5fa;
        font: 600 20px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.01em;
        pointer-events: none;
        transition: opacity 320ms ease-out;
      }
      #boot.is-leaving {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">Kart Limitlerim</div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
