<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#0A0A11" media="(prefers-color-scheme: light)" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

      /* Boot screen: painted as soon as this HTML is parsed, before the CSS and JS arrive.
         Same night ground as the iOS launch screen and src/ui/tokens.css --night-ground.

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a11;
        color: #f5f5fa;
        font: 600 20px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="boot">Kart Limitlerim</div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
